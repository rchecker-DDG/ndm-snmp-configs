# =============================================================================
# Branch-A — Per-Device SNMP Instances  ·  conf.d/snmp.d/conf.yaml
# Namespace : branch-a  (set in datadog.yaml)
# ⚠  Same IPs as branch-b — namespace prefix makes them unique in Datadog
# =============================================================================

init_config:
  loader: core
  use_device_id_as_hostname: true

x-v3: &v3
  snmp_version: 3
  username:     dd_snmpv3
  authProtocol: SHA256
  authKey:      "{{ DD_SNMP_AUTH_KEY }}"
  privProtocol: AES256
  privKey:      "{{ DD_SNMP_PRIV_KEY }}"

instances:

  # ── cEdge-BRA (Cisco SD-WAN branch router) ───────────────────────────────
  - ip_address: 192.168.10.1
    <<: *v3
    use_device_id_as_hostname: true
    tags:
      - "site:branch-a"
      - "region:us-east"
      - "role:router"
      - "function:sdwan-cedge"
      - "vendor:cisco"
      - "model:isr-4331"
      - "env:production"
      - "geo_city:new-york"
      - "geo_country:us"
    interface_configs:
      - match_field: interface_name
        match_value: "GigabitEthernet0/0/0"
        tags:
          - "intf_role:wan"
          - "wan_provider:att"
          - "wan_circuit:bra-att-dia-primary"
          - "sdwan_tloc_color:biz-internet"
          - "redundancy:primary"
          - "geo_region:us-east"
        speed_override: 100000000
      - match_field: interface_name
        match_value: "GigabitEthernet0/0/1"
        tags:
          - "intf_role:wan"
          - "wan_provider:comcast"
          - "wan_circuit:bra-comcast-dia-secondary"
          - "sdwan_tloc_color:biz-internet"
          - "redundancy:secondary"
        speed_override: 100000000
      - match_field: interface_name
        match_value: "GigabitEthernet1"
        tags: ["intf_role:lan-uplink", "connected_to:c9300-bra"]
        speed_override: 1000000000

  # ── C9300-BRA (Cisco Catalyst 9300 — branch access/dist) ─────────────────
  - ip_address: 192.168.10.2
    <<: *v3
    use_device_id_as_hostname: true
    tags:
      - "site:branch-a"
      - "region:us-east"
      - "role:switch"
      - "function:branch-access"
      - "vendor:cisco"
      - "model:c9300"
      - "env:production"
      - "geo_city:new-york"
    interface_configs:
      - match_field: interface_name
        match_value: "GigabitEthernet1/0/49"
        tags: ["intf_role:uplink", "connected_to:cedge-bra"]
        speed_override: 1000000000
      - match_field: interface_name
        match_value: "GigabitEthernet1/0/50"
        tags: ["intf_role:uplink", "connected_to:ex2300-bra"]
        speed_override: 1000000000
      - match_field: interface_name
        match_value: "GigabitEthernet1/0/1"
        tags: ["intf_role:access", "vlan:data", "connected_to:workstations"]
      - match_field: interface_name
        match_value: "GigabitEthernet1/0/24"
        tags: ["intf_role:access", "vlan:phones", "function:voice"]

  # ── EX2300-BRA (Juniper EX2300 — Mist-managed switch) ────────────────────
  - ip_address: 192.168.10.3
    <<: *v3
    use_device_id_as_hostname: true
    tags:
      - "site:branch-a"
      - "region:us-east"
      - "role:switch"
      - "function:mist-managed-switch"
      - "vendor:juniper"
      - "model:ex2300"
      - "mist_managed:true"
      - "env:production"
      - "geo_city:new-york"
    interface_configs:
      - match_field: interface_name
        match_value: "ge-0/0/0"
        tags: ["intf_role:uplink", "connected_to:c9300-bra", "mist_managed:true"]
        speed_override: 1000000000
      - match_field: interface_name
        match_value: "ge-0/0/1"
        tags: ["intf_role:access", "connected_to:ap43-bra", "vlan:wireless", "poe:enabled"]
        speed_override: 1000000000
      - match_field: interface_name
        match_value: "ge-0/0/2"
        tags: ["intf_role:access", "vlan:data"]

  # ── AP43-BRA (Juniper Mist AP43 — branch WiFi) ───────────────────────────
  # Mist APs support SNMP v3 for basic IF-MIB + sysDescr OIDs.
  # Full telemetry (client assoc, RSSI, band steering) comes from Mist API.
  # Configure via: Mist Dashboard → Organization → Site → WLAN → AP settings
  - ip_address: 192.168.10.10
    <<: *v3
    use_device_id_as_hostname: true
    tags:
      - "site:branch-a"
      - "region:us-east"
      - "role:access-point"
      - "function:mist-ap"
      - "vendor:juniper"
      - "model:ap43"
      - "mist_managed:true"
      - "env:production"
      - "geo_city:new-york"
      - "ssid_group:branch-wireless"
    # AP43 trap sender: configured via Mist Dashboard → Site → SNMP → Trap Receivers
    # Traps received on agent port 9162 (see datadog.yaml snmp_traps)
