# NDM SNMP — Device- and interface-level tagging
# Shows exactly where each kind of tag lands: instance-wide, derived-from-SNMP,
# and per-interface. Fill the <PLACEHOLDERS> and drop in
# /etc/datadog-agent/conf.d/snmp.d/conf.yaml, then restart the Agent.

init_config:
  loader: core
  use_device_id_as_hostname: true     # required for custom device tags to bind to the device

instances:
  - ip_address: <DEVICE_IP>
    snmp_version: 2
    community_string: <COMMUNITY>
    profile: <PROFILE_NAME>

    # (1) Instance-wide tags -> applied to the DEVICE and EVERY metric it emits.
    tags:
      - 'site:<SITE>'
      - 'env:<ENV>'
      - 'team:<TEAM>'
      - 'cost_center:<COST_CENTER>'

    # (2) metric_tags -> tags derived from live SNMP values, added to the device's metrics.
    metric_tags:
      # Direct form: one symbol -> one tag.
      - OID: 1.3.6.1.2.1.1.5.0          # sysName
        symbol: sysName
        tag: snmp_host                  # produces snmp_host:<sysName value>

      # Regex-split form: carve one symbol into several tags.
      # e.g. sysName "edge-nyc01" -> device_type:edge, location:nyc01
      - OID: 1.3.6.1.2.1.1.5.0          # sysName
        symbol: sysName
        match: (.*)-(.*)                # two capture groups
        tags:
          device_type: \1               # first group
          location: \2                  # second group

    # (3) interface-level tags -> applied ONLY to the matched interface's metrics.
    interface_configs:
      - match_field: name
        match_value: GigabitEthernet0/1
        tags:
          - 'role:uplink'
          - 'peer:isp'
