# NCM — known_hosts setup and the insecure_skip_verify tradeoff
#
# `known_hosts_path` is one of the most commonly misconfigured NCM fields.
# It must point to a REAL OpenSSH known_hosts file that already contains
# this device's actual host key — the same format and file `ssh` itself
# uses, not an empty placeholder file the Agent will populate for you.
#
# Populate it before first use, from a host that can already reach the device:
#   ssh-keyscan -H <DEVICE_IP> >> /etc/datadog-agent/.ssh/known_hosts
# Then verify the fingerprint out-of-band (e.g. against the vendor console or
# a change ticket) before trusting it — ssh-keyscan itself does not verify
# authenticity, it only retrieves whatever key the device currently presents.

init_config:
  namespace: default
  min_collection_interval: 900
  ssh:
    timeout: 30
    # Production-recommended: a populated known_hosts file, verified out-of-band.
    known_hosts_path: /etc/datadog-agent/.ssh/known_hosts
    insecure_skip_verify: false

    # --- Development/lab-only alternative, NOT for production ---
    # insecure_skip_verify: true accepts any host key presented by the device,
    # which means NCM cannot detect a man-in-the-middle or a swapped device at
    # the same IP. Use only in isolated lab environments while you build out a
    # real known_hosts file, then flip this back to false.
    # insecure_skip_verify: true

instances:
  - ip_address: <DEVICE_IP>
    auth:
      username: <USERNAME>
      password: <PASSWORD>
