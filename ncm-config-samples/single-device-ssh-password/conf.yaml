# NCM — Single device, SSH username/password
#
# This is a filled-in, working example — not just a template. The IP address
# below (198.51.100.10) is from the documentation-only range reserved by
# RFC 5737, and the username/password are example values. Copy this file,
# then change ONLY the three values marked "# CHANGE THIS" to match your
# own device and credentials; everything else can stay as-is for a simple
# single-device setup.
#
# NCM requires the device to already be monitored by NDM (SNMP) — NCM adds
# config backup/diff/rollback on top of an existing NDM device, it does not
# replace the SNMP conf.yaml.

init_config:
  namespace: default              # must match the namespace the device uses in NDM (snmp.d); "default" if you never set one
  min_collection_interval: 900    # seconds between config pulls; 900 (15 min) is the default, shown for clarity
  ssh:
    timeout: 30                   # seconds to establish the TCP/SSH connection before failing
    known_hosts_path: /etc/datadog-agent/.ssh/known_hosts   # must exist and contain this device's real host key —
                                                             # see known-hosts-setup/known_hosts.example for the format
    insecure_skip_verify: false   # leave false in production — see known-hosts-setup/README.md for the tradeoff

# IMPORTANT: `instances` is a top-level list, as a sibling of `init_config`,
# NOT nested inside `ssh:`. Each `-` starts a new device. A single misplaced
# indent here is the single most common NCM config mistake — it produces
# errors like "no valid instances" or "no SSH configuration found" with no
# obvious pointer back to the indentation itself.
instances:
  - ip_address: 198.51.100.10     # CHANGE THIS — your device's real management IP
    auth:
      username: ncm-readonly      # CHANGE THIS — see least-privilege-service-account/ for scoping this account
      password: "Example-Password-123"   # CHANGE THIS — plaintext here for clarity only;
                                          # use secrets-management/ for a production-safe version
