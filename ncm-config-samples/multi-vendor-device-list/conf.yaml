# NCM — Multi-vendor device list (no autodiscovery)
#
# A filled-in working example of a small, realistic mixed-vendor fleet —
# not just a bracketed template. IPs use the RFC 5737 documentation range
# (198.51.100.0/24), so nothing here resembles real production infra. Copy
# this file, then change each device's IP/credentials to your own fleet.
#
# Unlike NDM's SNMP integration, NCM does not support subnet/network
# autodiscovery — every device you want configuration tracking for must be
# its own explicit entry under `instances`.
#
# NCM auto-detects the vendor/OS profile per device and runs the matching
# vendor-specific commands over SSH — you don't declare a vendor or profile
# field yourself, just the connection details.

init_config:
  namespace: default
  min_collection_interval: 900
  ssh:
    timeout: 30
    known_hosts_path: /etc/datadog-agent/.ssh/known_hosts
    insecure_skip_verify: false

instances:
  # Core switch — Cisco IOS
  - ip_address: 198.51.100.20     # CHANGE THIS
    auth:
      username: ncm-readonly      # CHANGE THIS
      password: "Example-Password-123"   # CHANGE THIS

  # Edge router — Juniper JunOS
  - ip_address: 198.51.100.21     # CHANGE THIS
    auth:
      username: ncm-readonly      # CHANGE THIS
      password: "Example-Password-123"   # CHANGE THIS

  # Data center leaf — Arista EOS (key-based auth, see single-device-ssh-key/)
  - ip_address: 198.51.100.22     # CHANGE THIS
    auth:
      username: ncm-readonly      # CHANGE THIS
      private_key_file: /etc/datadog-agent/.ssh/ncm_ed25519   # CHANGE THIS

  # Perimeter firewall — FortiGate FortiOS
  - ip_address: 198.51.100.23     # CHANGE THIS
    auth:
      username: ncm-readonly      # CHANGE THIS
      password: "Example-Password-123"   # CHANGE THIS

  # Add one entry per device. For fleets beyond a handful of devices,
  # see scale-templating/ for a generate-the-YAML-from-inventory pattern
  # instead of hand-maintaining this list.
