init_config:
  namespace: default
  min_collection_interval: 900
  ssh:
    timeout: 30
    known_hosts_path: /etc/datadog-agent/.ssh/known_hosts
    insecure_skip_verify: false

instances:
  - ip_address: 198.51.100.40
    auth:
      username: ncm-readonly
      password: ENC[ncm_svc_password]
  - ip_address: 198.51.100.41
    auth:
      username: ncm-readonly
      password: ENC[ncm_svc_password]
  - ip_address: 198.51.100.42
    auth:
      username: ncm-readonly
      private_key_file: ENC[ncm_svc_private_key]
