# NCM — Keeping SSH credentials out of plaintext conf.yaml
#
# Every other sample in this directory shows <PASSWORD> / <PRIVATE_KEY_PATH>
# as literal placeholders for clarity, but shipping real credentials in
# plaintext conf.yaml is a production anti-pattern. The Datadog Agent's
# secrets management feature lets you reference an external secret instead,
# resolved at Agent startup via a `secret_backend_command` you configure
# (e.g. backed by Vault, AWS Secrets Manager, or a simple local script).
#
# This is a general Agent capability, not NCM-specific — validate that your
# secret backend is already working for another integration (or test it
# directly) before assuming it applies seamlessly here. See:
# https://docs.datadoghq.com/agent/configuration/secrets-management/

init_config:
  namespace: default
  min_collection_interval: 900
  ssh:
    timeout: 30
    known_hosts_path: /etc/datadog-agent/.ssh/known_hosts
    insecure_skip_verify: false

instances:
  - ip_address: <DEVICE_IP>
    auth:
      username: ENC[ncm_svc_account_username]   # resolved by your configured secret_backend_command
      password: ENC[ncm_svc_account_password]   # resolved by your configured secret_backend_command
